services:
  azurite:
    build:
      context: .
      dockerfile: Dockerfile.azurite
    container_name: PoSeeReview
    ports:
      - "10000:10000" # Blob service
      - "10001:10001" # Queue service
      - "10002:10002" # Table service
    volumes:
      - azurite-data:/data
    restart: unless-stopped

volumes:
  azurite-data:
