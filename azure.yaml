# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: poseereview
metadata:
  template: poseereview@0.0.1-beta

# Hosting is App Service, matching .github/workflows/deploy.yml — the only path that
# actually deploys this app. The Container Apps variant (azure.yaml host: containerapp,
# a Dockerfile, and two bicep modules) was removed: nothing built or deployed it.
services:
  api:
    project: ./src/PoSeeReview.Api
    language: csharp
    host: appservice
