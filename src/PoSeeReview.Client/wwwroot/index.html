<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoSeeReview</title>
    <base href="/" />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <!-- Bootstrap removed: 31KB gzipped for six classes, all of which app.css already redefined,
         and whose duplicates were feeding the cascade conflicts the layer system now prevents.
         app.css carries a minimal reset in @layer reset instead. -->
    <!-- app.css @imports PoSeeReview.Client.styles.css (the Blazor scoped-CSS bundle) into
         @layer page. That is the only way to put framework-generated CSS in a layer, and it is
         what stops a scoped sheet from silently overriding a shared primitive. Do NOT re-add a
         separate <link> for it — that would load it unlayered, where it beats every layer. -->
    <!-- Radzen's stylesheet is NOT linked here. app.css @imports it into @layer vendor, because
         unlayered CSS outranks every layer regardless of source order — a plain <link> would put
         Radzen's Material defaults above the entire design system. -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- PWA. The app is mobile-first and opened in short bursts, which is exactly the shape
         install-to-homescreen exists for; before this there was no manifest, no worker and no
         maskable icon, so it could never be installed. theme-color paints the Android status
         bar and the iOS/desktop title bar to match the nav. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#7C3AED" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PoSeeReview" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Turn a restaurant's weirdest Google Maps reviews into a four-panel comic strip." />

    <!-- Application Insights will be added when deployed to Azure -->
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="geolocation.js"></script>
    <script src="share-utils.js"></script>
    <!-- Must load before Blazor: `beforeinstallprompt` fires early and is only capturable if
         its default is prevented the moment it arrives. -->
    <script src="pwa.js"></script>
    <!-- Graphics + audio. type="module" so the heavy scenes can be dynamically imported on
         demand; nothing under lib/ is fetched until a page actually asks for it. Loaded before
         Blazor so window.poseeFx exists by the time the first component calls into it. -->
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script type="module" src="js/fx.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Registered after Blazor starts loading so the worker never competes with the boot
         request it exists to accelerate. Failure is silent on purpose: a browser with service
         workers disabled must still get a working app, not a console-level error. -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/service-worker.js').catch(function () {
                    /* No offline support in this browser. Everything else works. */
                });
            });
        }
    </script>
</body>

</html>
