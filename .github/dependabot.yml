# Dependabot — automated version updates for GitHub Actions, NuGet, Docker.
# Schedule: weekly Monday 06:00 UTC (low-traffic window for CI builds).
version: 2
updates:
  # Keep GitHub Actions pinned to the latest major.minor (Node 24 era).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5

  # NuGet: track Central Package Management updates from Directory.Packages.props.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    groups:
      nuget-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Major bumps need a review pass for breaking changes.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10

  # Docker: track base image updates for the multi-stage Dockerfile. Pin to
  # minor + patch (no auto-bump to a new .NET major) to avoid surprise
  # runtime changes.
  - package-ecosystem: "docker"
    directory: "/src/Po.SeeReview.Api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    groups:
      dotnet-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
    open-pull-requests-limit: 3
