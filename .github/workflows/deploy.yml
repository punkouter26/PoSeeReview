name: Build & Deploy

# Lightweight pipeline — strictly builds the app and deploys it to Azure App Service.
# No test execution lives here (tests run locally / in the tiered suites). If a deploy
# issue arises, prefer trimming this file further over adding functionality.

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: app-poseereview
  AZURE_RESOURCE_GROUP: PoSeeReview
  API_PROJECT_PATH: src/PoSeeReview.Api/PoSeeReview.Api.csproj

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish
          retention-days: 1

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 20
    environment:
      name: production
      url: https://app-poseereview.azurewebsites.net
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # The publish output contains two runtimeconfig.json files (Api + hosted WASM Client),
      # which defeats Linux App Service startup auto-detection and leaves the parking page up.
      # Pin the startup command so every deploy is self-healing.
      - name: Ensure startup command
        run: >
          az webapp config set
          --name ${{ env.AZURE_WEBAPP_NAME }}
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }}
          --startup-file "dotnet PoSeeReview.Api.dll"
          --output none

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: publish
