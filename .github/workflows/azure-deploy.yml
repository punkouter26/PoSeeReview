name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  APP_NAME: app-poseereview
  DOTNET_VERSION: '10.0.x'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6.0.2

    - name: Setup .NET
      uses: actions/setup-dotnet@v5.2.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore

    - name: Run unit tests
      run: |
        dotnet test tests/Po.SeeReview.UnitTests/Po.SeeReview.UnitTests.csproj \
          --no-restore \
          --configuration Release \
          --logger "console;verbosity=minimal" \
          --results-directory ./test-results

    - name: Verify formatting
      run: dotnet format PoSeeReview.sln --verify-no-changes --verbosity minimal

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: "**/*.trx"

    - name: Publish API (includes Blazor WASM client)
      run: |
        dotnet publish src/Po.SeeReview.Api/Po.SeeReview.Api.csproj \
          -c Release \
          -o ./publish \
          --no-restore

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: published-app
        path: ./publish
        retention-days: 1

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ env.APP_NAME }}.azurewebsites.net

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: published-app
        path: ./publish

    - name: Azure Login (OIDC)
      uses: azure/login@v3.0.0
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy to App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.APP_NAME }}
        package: ./publish

    - name: Verify deployment health
      run: |
        BASE_URL="https://${{ env.APP_NAME }}.azurewebsites.net"

        echo "Waiting 30s for app to start..."
        sleep 30

        for i in $(seq 1 20); do
          LIVE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 \
            "$BASE_URL/api/health/live" 2>/dev/null) || LIVE_STATUS="000"

          echo "Attempt $i/20: /api/health/live=$LIVE_STATUS"

          if [ "$LIVE_STATUS" = "200" ]; then
            echo "App is live after deployment"
            exit 0
          fi

          sleep 30
        done

        echo "App did not become live after deployment"
        exit 1




